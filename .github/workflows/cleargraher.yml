name: ClearGraher build

on:
    workflow_dispatch:
        inputs:
            cleargraher-version:
                description: ClearGraher version bruh
                type: string
                default: '0.0.0'
run-name: Building ClearGraher ${{inputs.cleargraher-version}}
permissions:
    contents: write
jobs:
    apk:
        name: Generate APK
        runs-on: ubuntu-latest
        environment: cleargraherkeys
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up AWS Coretto 21
                uses: actions/setup-java@v5
                with:
                    java-version: '21'
                    distribution: 'corretto'
                    architecture: x64
            -   name: Setup Gradle 8.14.5
                uses: gradle/actions/setup-gradle@v6
                with:
                    gradle-version: '8.14.5'
            -   name: Install ccache and disable gradle configuration cache
                run: |
                    sudo apt-get update && sudo apt-get install -y ccache
                    sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' $GITHUB_WORKSPACE/gradle.properties
                    sed -i 's/org.gradle.configuration-cache.problems=warn/# org.gradle.configuration-cache.problems=warn/' $GITHUB_WORKSPACE/gradle.properties
            -   name: Enable ClearGraher keystore
                env:
                    CLEARGRAHER_KEYSTORE_BASE64: ${{secrets.CLEARGRAHER_KEYSTORE_BASE64}}
                    CLEARGRAHER_RELEASE_STORE_PASSWORD: ${{secrets.CLEARGRAHER_RELEASE_STORE_PASSWORD}}
                    CLEARGRAHER_RELEASE_KEY_ALIAS: ${{secrets.CLEARGRAHER_RELEASE_KEY_ALIAS}}
                    CLEARGRAHER_RELEASE_KEY_PASSWORD: ${{secrets.CLEARGRAHER_RELEASE_KEY_PASSWORD}}
                run: |
                    mv $GITHUB_WORKSPACE/TMessagesProj/config/release.keystore $GITHUB_WORKSPACE/TMessagesProj/config/release.keystore.old
                    echo "$CLEARGRAHER_KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/TMessagesProj/config/release.keystore
                    cp $GITHUB_WORKSPACE/gradle.properties $GITHUB_WORKSPACE/gradle.properties.old
                    sed -i "s/RELEASE_STORE_PASSWORD=android/RELEASE_STORE_PASSWORD=$CLEARGRAHER_RELEASE_STORE_PASSWORD/g" $GITHUB_WORKSPACE/gradle.properties
                    sed -i "s/RELEASE_KEY_ALIAS=androidkey/RELEASE_KEY_ALIAS=$CLEARGRAHER_RELEASE_KEY_ALIAS/g" $GITHUB_WORKSPACE/gradle.properties
                    sed -i "s/RELEASE_KEY_PASSWORD=android/RELEASE_KEY_PASSWORD=$CLEARGRAHER_RELEASE_KEY_PASSWORD/g" $GITHUB_WORKSPACE/gradle.properties
            -   name: Build APK
                run: gradle :TMessagesProj_AppStandalone:assembleStandalone
            -   name: Disable ClearGraher keystore
                if: always()
                run: |
                    rm $GITHUB_WORKSPACE/TMessagesProj/config/release.keystore
                    mv $GITHUB_WORKSPACE/TMessagesProj/config/release.keystore.old $GITHUB_WORKSPACE/TMessagesProj/config/release.keystore
                    rm $GITHUB_WORKSPACE/gradle.properties
                    mv $GITHUB_WORKSPACE/gradle.properties.old $GITHUB_WORKSPACE/gradle.properties
            -   name: Prepare APK and release notes
                id: prep
                env:
                    CLEARGRAHER_VERSION: ${{inputs.cleargraher-version}}
                run: |
                    set -euo pipefail
                    APK_DIR="$GITHUB_WORKSPACE/TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone"
                    APK=$(ls "$APK_DIR"/ClearGraher-*.apk 2>/dev/null | head -1)
                    if [ -z "$APK" ] || [ ! -f "$APK" ]; then
                       echo "APK not found at $APK" >&2
                       find "$GITHUB_WORKSPACE/TMessagesProj_AppStandalone/build/outputs" -type f >&2
                       exit 1
                    fi
                    OUT="$APK_DIR/ClearGraher-$CLEARGRAHER_VERSION.apk"
                    mv "$APK" "$OUT"
                    HASH=$(sha256sum "$OUT" | awk '{print $1}')
                    SIZE=$(stat -c %s "$OUT")
                    BODY="$GITHUB_WORKSPACE/release_body.md"
                    {
                      echo "# ClearGraher $CLEARGRAHER_VERSION"
                      echo ""
                      echo "Telegram/Telegraher fork - no ads, no remote deletions, full control."
                      echo "Base: Telegraher 12.92.5. Package: org.telegram.messenger.web."
                      echo ""
                      echo "## Changelog"
                      echo ""
                      awk '/^## \[/{n++} n==1{print} n==2{exit}' "$GITHUB_WORKSPACE/CHANGELOG.md"
                      echo ""
                      echo "## Downloads"
                      echo ""
                      echo "| APK | Architecture | Size | SHA-256 |"
                      echo "|---|---|---|---|"
                      echo "| [ClearGraher-$CLEARGRAHER_VERSION.apk](https://github.com/elizqmill/ClearGraher/releases/download/clearghraher_$CLEARGRAHER_VERSION/ClearGraher-$CLEARGRAHER_VERSION.apk) | universal (all architectures) | $SIZE bytes | \`$HASH\` |"
                    } > "$BODY"
                    echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
                    echo "body_path=$BODY" >> "$GITHUB_OUTPUT"
                    echo "APK ready:"
                    ls -la "$OUT"
            -   name: Create Release and Upload APK
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: clearghraher_${{inputs.cleargraher-version}}
                    name: ClearGraher ${{inputs.cleargraher-version}}
                    files: ${{ steps.prep.outputs.apk_path }}
                    body_path: ${{ steps.prep.outputs.body_path }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}